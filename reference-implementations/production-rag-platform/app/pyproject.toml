[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "production-rag-platform"
version = "0.1.0"
description = "Secure and observable RAG reference API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_platform"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
