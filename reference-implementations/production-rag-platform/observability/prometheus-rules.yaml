groups:
  - name: rag-platform-slo
    rules:
      - alert: RagApiHighErrorRate
        expr: |
          sum(rate(rag_requests_total{operation="query",outcome!="success"}[5m]))
          /
          clamp_min(sum(rate(rag_requests_total{operation="query"}[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: RAG query error rate is above 5 percent
          runbook_url: docs/runbooks/query-degradation.md
      - alert: RagApiHighP95Latency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(rag_query_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: RAG query p95 latency is above 2 seconds
          runbook_url: docs/runbooks/query-degradation.md
      - alert: RagApiNoSuccessfulQueries
        expr: |
          (
            sum(rate(rag_requests_total{operation="query",outcome="success"}[10m]))
            or vector(0)
          ) == 0
          and
          sum(rate(rag_requests_total{operation="query"}[10m])) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: No successful RAG queries observed while query traffic is present
          description: Prevents false positives during idle periods by requiring query traffic.
          runbook_url: docs/runbooks/query-degradation.md
